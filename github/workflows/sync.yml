name: Sync to Live Repo
on:
  push:
    branches:
      - main
      - master

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Push to MECH360-WEB
        run: |
          git config --global user.name "sync-bot"
          git config --global user.email "bot@sync.com"
          git remote add dest https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/Micheal2code/MECH360-WEB.git
          git branch -M main
          git push dest main --force
