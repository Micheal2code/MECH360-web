name: Sync
on:
  push:
    branches: [main]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to Repo 2
        run: |
          git remote add second https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/Micheal2code/Mech360-web.git
          git push second main -f
