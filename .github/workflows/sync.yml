name: Sync to Live Repo
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Push to MECH360-WEB
        run: |
          git config user.name "Micheal2code"
          git config user.email "micheal@github.com"
          git remote remove dest || true
          git remote add dest https://Micheal2code:${{ secrets.PAT_TOKEN }}@github.com/Micheal2code/MECH360-web.git
          git push dest main --force
