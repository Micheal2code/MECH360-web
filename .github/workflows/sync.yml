name: Sync to Live Repo
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mech360-web2
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Push to MECH360-WEB
        run: |
          git config user.name "Micheal2code"
          git config user.email "micheal2code@users.noreply.github.com"
          git remote add dest https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/Micheal2code/MECH360-WEB.git
          git push dest HEAD:main -f
